# Uses the image's own mechanism: it clones GIT_REPOSITORY, pip-installs requirements.txt, runs `python .`
services:
  lan-manager:
    image: davidlor/python-git-app        # consider pinning a tag, e.g. :3.12
    container_name: lan-manager
    restart: unless-stopped
    environment:
      GIT_REPOSITORY: "https://github.com/YOU/lan-manager.git"   # <- your repository
      # GIT_BRANCH: main
      LAN_DATA_DIR: /home/user/data
      LAN_ENCRYPTION_KEY: "${LAN_ENCRYPTION_KEY}"                # see .env.example
      TZ: "Europe/Oslo"
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW                           # allows ICMP ping as a non-root user
    volumes:
      - ./data:/home/user/data            # SQLite database (bind mount: easy to back up)
      - lan-local:/home/user/.local       # pip packages survive container re-creation
      - lan-cache:/home/user/.cache
volumes:
  lan-local:
  lan-cache:
