# Everything lives inside the one container: no host folders are mapped.
services:
  lan-manager:
    image: davidlor/python-git-app
    container_name: lan-manager
    restart: unless-stopped
    environment:
      GIT_REPOSITORY: "https://github.com/YOU/lan-manager.git"
      TZ: "Europe/Oslo"
      # Optional: create the first admin from the environment instead of the /setup page
      # LAN_ADMIN_USER: "admin"
      # LAN_ADMIN_PASSWORD: "change-me-please"
    ports:
      - "8080:8080"
    cap_add:
      - NET_RAW      # lets the container user send ICMP ping
